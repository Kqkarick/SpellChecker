name: Build SpellChecker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build SpellChecker.csproj --configuration Release -p:PlatformTarget=x86 -p:RuntimeIdentifier=win-x86

      - name: Show build files
        shell: pwsh
        run: Get-ChildItem -Path . -Recurse -File | Where-Object { $_.Name -match 'SpellChecker.*\.(dll|json)$' } | Select-Object -ExpandProperty FullName

      - name: Upload DLL files
        uses: actions/upload-artifact@v4
        with:
          name: SpellChecker-x86
          path: |
            **/SpellChecker.dll
            **/SpellChecker.comhost.dll
            **/SpellChecker.runtimeconfig.json
            **/SpellChecker.deps.json
          if-no-files-found: warn

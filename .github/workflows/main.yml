name: Build SpellChecker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build x86 COM component
        run: dotnet build SpellChecker.csproj --configuration Release -p:PlatformTarget=x86 -p:RuntimeIdentifier=win-x86

      - name: Upload DLL files
        uses: actions/upload-artifact@v4
        with:
          name: SpellChecker-x86
          path: |
            /bin/Release//SpellChecker.dll
            /bin/Release//SpellChecker.comhost.dll
            /bin/Release//SpellChecker.runtimeconfig.json
            /bin/Release//SpellChecker.deps.json
          if-no-files-found: error
